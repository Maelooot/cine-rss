name: Mise a jour du flux
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fetch_films.py
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "maj flux"
          git push
